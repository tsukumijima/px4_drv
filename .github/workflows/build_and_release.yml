name: Build and Release Debian Package

on:
  push:
    tags:
      - "*"

jobs:
  build_and_release:
    name: Build and Release Debian Package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install DKMS
        run: apt-get update && apt-get install -y -q --no-install-recommends debhelper devscripts dh-exec dkms dpkg
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build Debian package
        run: dkms mkdeb --source-only
        shell: bash

      - name: Check artifacts
        run: ls -l ../*.deb
        shell: bash

      - name: Check install
        run: dpkg -i $(ls -1 ../*.deb | head -n 1)
        shell: bash

      - name: Check dkms install
        run: apt-get install -y linux-headers-virtual
        shell: bash

      - name: Check dkms result
        run: ls -l /lib/modules/*/updates/dkms/px4_drv.ko*
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ../*.deb

  build_pcsc:
    name: Build and Check PC/SC Package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:20.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: apt-get update && apt-get install -y -q --no-install-recommends g++ make pkg-config libpcsclite-dev binutils dpkg python3
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Check IFD handler
        run: make -C pcsc check LDFLAGS="-static-libstdc++ -static-libgcc"

      - name: Build PC/SC Debian package
        run: bash build_pcsc_deb.sh

      - name: Check package and install
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          dpkg-deb -c ../px4-drv-pcsc_*_${{ matrix.arch }}.deb
          dpkg-deb -f ../px4-drv-pcsc_*_${{ matrix.arch }}.deb Depends Maintainer
          dpkg -i ../px4-drv-pcsc_*_${{ matrix.arch }}.deb
          pcsc/build/ifdhandler_test /usr/lib/pcsc/drivers/ifd-px4.bundle/Contents/Linux/libifd-px4.so

      - name: Upload PC/SC package
        uses: actions/upload-artifact@v7
        with:
          name: pcsc-${{ matrix.arch }}
          path: ../px4-drv-pcsc_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  release_pcsc:
    name: Attach PC/SC Packages to Release
    needs: [build_and_release, build_pcsc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download PC/SC packages
        uses: actions/download-artifact@v8
        with:
          pattern: pcsc-*
          merge-multiple: true
          path: pcsc-debs

      # 既存ジョブの Release 作成を待ち、両アーキテクチャの添付を1つのジョブに集めて更新の競合を避ける
      - name: Release PC/SC packages
        uses: softprops/action-gh-release@v3
        with:
          files: pcsc-debs/*.deb
          fail_on_unmatched_files: true
