name: Build and Release Debian Package

on:
  push:
    tags:
      - "*"

jobs:
  build_and_release:
    name: Build and Release Debian Package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    permissions:
      contents: write
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y -q --no-install-recommends git dkms dpkg
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Debian package
        run: ./build_deb.sh
        shell: bash

      - name: Check artifacts
        run: ls -l ../*.deb
        shell: bash

      - name: Check install
        run: dpkg -i ../px4-drv-dkms_*_all.deb
        shell: bash

      - name: Check dkms install
        run: apt-get install -y linux-headers-virtual
        shell: bash

      - name: Check dkms result
        run: ls -l /lib/modules/*/updates/dkms/px4_drv.ko*
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ../*.deb
