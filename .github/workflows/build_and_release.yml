name: Build and Release Debian Package

on:
  push:
    tags:
      - "*"

jobs:
  ifd:
    uses: ./.github/workflows/build_ifd.yml

  build_and_release:
    name: Build and Release Debian Package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install DKMS
        run: apt-get update && apt-get install -y -q --no-install-recommends debhelper devscripts dh-exec dkms dpkg
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build Debian package
        run: dkms mkdeb --source-only
        shell: bash

      - name: Check artifacts
        run: ls -l ../*.deb
        shell: bash

      - name: Check install
        run: dpkg -i ../px4-drv-dkms_*_all.deb
        shell: bash

      - name: Check dkms install
        run: apt-get install -y linux-headers-virtual
        shell: bash

      - name: Check dkms result
        run: ls -l /lib/modules/*/updates/dkms/px4_drv.ko*
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: deb-dkms
          path: ../px4-drv-dkms_*_all.deb
          if-no-files-found: error

  release:
    needs: [build_and_release, ifd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: packages
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            packages/*.deb
          fail_on_unmatched_files: true
