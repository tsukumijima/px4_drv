name: Build and Check Debian Package

on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Build and Check Debian Package (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['20.04', '24.04']
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    permissions:
      contents: write
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y -q --no-install-recommends git dkms dpkg
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Debian package
        run: ./build_deb.sh
        shell: bash

      - name: Check artifacts
        run: ls -l ../*.deb
        shell: bash

      - name: Check install
        run: dpkg -i ../px4-drv-dkms_*_all.deb
        shell: bash

      - name: Check dkms install
        run: apt-get install -y linux-headers-virtual
        shell: bash

      - name: Check dkms result
        run: ls -l /lib/modules/*/updates/dkms/px4_drv.ko*
        shell: bash
